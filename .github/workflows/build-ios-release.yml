name: Build iOS Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle (KMP)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/gradle.properties') }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            iosApp/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('**/Podfile.lock') }}

      - name: Set iOS version
        run: |
          VERSION_CODE=$((403 + ${{ github.run_number }} * 10 + ${{ github.run_attempt }}))

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION_NAME="${{ github.ref_name }}"
          else
            VERSION_NAME="0.0.${{ github.run_number }}"
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" iosApp/iosApp/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION_CODE" iosApp/iosApp/Info.plist

      - name: Build iOS
        uses: yukiarrr/ios-build-action@v1.12.0
        with:
          project-path: iosApp/iosApp.xcodeproj
          workspace-path: iosApp/iosApp.xcodeproj/project.xcworkspace
          scheme: iosApp
          export-options: iosApp/options.plist
          p12-base64: ${{ secrets.IOS_FEED_P12_BASE64 }}
          mobileprovision-base64: ${{ secrets.FEED_IOS_MOBILE_PROVISION_BASE64 }}
          code-signing-identity: "Apple Distribution"
          team-id: ${{ secrets.IOS_TEAM_ID }}
          certificate-password: ${{ secrets.IOS_FEED_CERTIFICATE_PASSWORD }}

      - name: Rename IPA
        run: mv output.ipa iosApp.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: iosApp.ipa

  create-release:
    runs-on: ubuntu-latest
    needs: build-ios
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Github Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}