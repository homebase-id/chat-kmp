name: Build Mobile Release Production

on:
  workflow_dispatch:

  push:
    tags:
      - "*"

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Set Android version
        id: version
        run: |
          VERSION_NAME=$(grep 'version.name=' gradle/version.properties | cut -d'=' -f2)
          BASE=$(grep 'version.code.base=' gradle/version.properties | cut -d'=' -f2)
          VERSION_CODE=$((BASE + ${{ github.run_number }}))
          # Extract MAJOR.MINOR from version.name (e.g., 1.3.0 -> 1.3)
          MAJOR_MINOR=$(echo $VERSION_NAME | cut -d'.' -f1-2)
          # Create version like 1.3.1202 (use VERSION_CODE as patch)
          VERSION_NAME="${MAJOR_MINOR}.${VERSION_CODE}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          
          # Update version.properties with the full version
          sed -i "s/^version.name=.*/version.name=$VERSION_NAME/" gradle/version.properties
          
          echo "Updated version.properties:"
          cat gradle/version.properties  

      - name: Decode Homebase Keystore
        id: decode_keystore
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64_ENCODED }}
        run: |
          TMP_KEYSTORE_FILE_PATH="${RUNNER_TEMP}/keystore"
          mkdir "${TMP_KEYSTORE_FILE_PATH}"
          KEYSTORE_FILE_PATH="${TMP_KEYSTORE_FILE_PATH}/homebase.keystore"
          echo $ENCODED_STRING | base64 -d > "${KEYSTORE_FILE_PATH}"
          echo "KEYSTORE_FILE_PATH=$KEYSTORE_FILE_PATH" >> $GITHUB_OUTPUT

      - name: Build Android Bundle
        run: |
          ./gradlew --no-daemon :androidApp:bundleRelease \
            -PVERSION_CODE=${{ steps.version.outputs.VERSION_CODE }} \
            -PVERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}"
        env:
          SIGNING_KEYSTORE_FILE_PATH: ${{ steps.decode_keystore.outputs.KEYSTORE_FILE_PATH }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          JDK_21: ${{ env.JAVA_HOME }}

      - name: Rename output
        run: |
          mv androidApp/build/outputs/bundle/release/androidApp-release.aab \
             androidApp/build/outputs/bundle/release/homebase-id-app.aab

      - uses: actions/upload-artifact@v6
        with:
          name: homebase-id-app-android
          path: androidApp/build/outputs/bundle/release/homebase-id-app.aab

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-mapping-${{ steps.version.outputs.VERSION_CODE }}
          path: androidApp/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Create Google Play Service Account JSON
        run: |
          echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_DEV }}' > google-play-key.json

      - name: "Publish to Google Play internal track"
        run: ./gradlew publishReleaseBundle --artifact-dir androidApp/build/outputs/bundle/release

  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle (KMP)
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Kotlin/Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: |
            ~/.cocoapods
            iosApp/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      # DerivedData cache intentionally NOT used: restoring pre-signed
      # `.framework` artifacts (FFmpegKit ships ~7 of them) collides with
      # the new run's signing identity and `codesign`'s
      # validate-then-replace path on a previously-signed nested framework
      # can hang for hours on Apple Silicon runners (Xcode 26.x). Saves a
      # few minutes on a hit, costs 5h of CI minutes on a miss — not worth it.

      - name: Set iOS version
        run: |
          VERSION_NAME=$(grep 'version.name=' gradle/version.properties | cut -d'=' -f2)
          BASE=$(grep 'version.code.base=' gradle/version.properties | cut -d'=' -f2)
          VERSION_CODE=$((BASE + ${{ github.run_number }}))
          # Extract MAJOR.MINOR from version.name (e.g., 1.3.0 -> 1.3)
          MAJOR_MINOR=$(echo $VERSION_NAME | cut -d'.' -f1-2)
          # Create version like 1.3.1202 (use VERSION_CODE as patch)
          VERSION_NAME="${MAJOR_MINOR}.${VERSION_CODE}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          
          # Update version.properties with the full version
          sed -i '' "s/^version.name=.*/version.name=$VERSION_NAME/" gradle/version.properties
          
          echo "Updated version.properties:"
          cat gradle/version.properties  

          echo "Setting iOS version to $VERSION_NAME ($VERSION_CODE)"

          # Update Config.xcconfig — this is what Xcode actually reads for CFBundleVersion
          sed -i '' "s/CURRENT_PROJECT_VERSION=.*/CURRENT_PROJECT_VERSION=$VERSION_CODE/" iosApp/Configuration/Config.xcconfig
          sed -i '' "s/MARKETING_VERSION=.*/MARKETING_VERSION=$VERSION_NAME/" iosApp/Configuration/Config.xcconfig

          # Also update Info.plist as a fallback
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" iosApp/iosApp/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION_NAME" iosApp/iosApp/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION_CODE" iosApp/iosApp/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION_CODE" iosApp/iosApp/Info.plist

      - name: Inject CI build optimizations
        run: |
          cat >> iosApp/Configuration/Config.xcconfig << 'XCEOF'

          // CI optimizations
          COMPILER_INDEX_STORE_ENABLE = NO
          XCEOF

      # CI-only memory tuning for the 7 GB macos-15 runner. Appended at build
      # time so the repo's gradle.properties stays untouched for local dev;
      # in a Java properties file the LAST occurrence of a key wins.
      # Rollback: delete this step and the "Upload JVM OOM diagnostics" step.
      # Must run AFTER the Kotlin/Native cache step — its key hashes
      # gradle.properties and should see the pristine file.
      - name: Apply iOS CI memory overrides
        run: |
          mkdir -p /Users/runner/work/jvm-dumps
          cat >> gradle.properties << 'EOF'

          # --- CI-only overrides (appended by "Apply iOS CI memory overrides") ---
          # Gradle daemon only orchestrates this build; don't let it compete
          # with the Kotlin/Native compiler for the runner's 7 GB of RAM.
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/Users/runner/work/jvm-dumps
          kotlin.daemon.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/Users/runner/work/jvm-dumps
          # One K/N task at a time; incremental-native caches are dead weight
          # on a one-shot runner.
          kotlin.native.gradle.workers.max=1
          kotlin.incremental.native=false
          # Run each K/N compilation in a fresh short-lived process so the
          # release link starts with a clean heap instead of inheriting 45+
          # minutes of accumulated daemon heap (build 27400310875 OOM).
          kotlin.native.disableCompilerDaemon=true
          # 8g EXPERIMENT round 3: round 2's 6g cap OOM'd outright
          # (run 28931927413, "Java heap space" ~20 min into the link), so the
          # no-devirt transient peak is >6g even though the settled live set is
          # ~4.4G (run 28927080827: zero Full GCs at 12g, after-GC flat at
          # ~4.4G from minute 12). Probing 8g: 3.6G headroom over live, and far
          # less committed-into-swap than 12g on the 7 GB runner. If 8g
          # thrashes/OOMs, the answer is devirt-off + 12g (proven green).
          kotlin.native.jvmArgs=-Xmx8g -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/Users/runner/work/jvm-dumps -Xlog:gc*:file=/Users/runner/work/jvm-dumps/kn-gc-%p.log
          # EXPERIMENT (ios-link-no-devirt-experiment): skip the K/N LTO phase that
          # owns ~5.1 GB of the link's live set (MAT, run 27407420160). See the
          # gated freeCompilerArgs block in homebase-core/build.gradle.kts.
          # Expected: link peak drops well under the runner's 7 GB RAM (no swap),
          # link time drops from ~56 min toward ~10-20 min; IPA somewhat larger.
          homebase.native.disableDevirtualization=true
          EOF
          echo "Appended CI memory overrides to gradle.properties:"
          tail -n 20 gradle.properties

      - name: Strip existing FFmpegKit signatures
        run: |
          cd homebase-api/libs/ffmpegkit-bundled.xcframework
          for xcf in *.xcframework; do
            for arch in "$xcf"/*; do
              if [ -d "$arch" ]; then
                for framework in "$arch"/*.framework; do
                  if [ -d "$framework" ]; then
                    echo "Stripping signature from $framework"
                    codesign --remove-signature "$framework" 2>/dev/null || true
                  fi
                done
              fi
            done
          done

      # fastlane's build_app starts with `xcodebuild -resolvePackageDependencies`,
      # which has no timeout: run 27409300090 hung there for 35 min (vs 80 s in
      # the previous green run) on a stuck GitHub fetch. Pre-resolve here with a
      # watchdog + retries; gym's own resolve then hits warm SwiftPM caches.
      # Non-fatal on persistent failure — gym gets its usual chance.
      - name: Pre-resolve SPM dependencies (watchdog + retry)
        run: |
          for attempt in 1 2 3; do
            echo "SPM resolve attempt $attempt"
            xcodebuild -resolvePackageDependencies \
              -workspace iosApp/iosApp.xcodeproj/project.xcworkspace \
              -scheme iosApp -configuration Release &
            xb=$!
            ( sleep 600; echo "watchdog: killing stuck resolve"; kill "$xb" 2>/dev/null ) &
            wd=$!
            if wait "$xb"; then
              kill "$wd" 2>/dev/null || true
              echo "SPM dependencies resolved on attempt $attempt"
              exit 0
            fi
            kill "$wd" 2>/dev/null || true
            echo "attempt $attempt failed or timed out"
          done
          echo "::warning ::SPM pre-resolve failed 3 times; letting fastlane try"
          exit 0

      # The build action's bundled Fastfile runs create_keychain(timeout: 3600):
      # the build keychain auto-locks after 60 minutes. A cold-cache archive
      # (Kotlin/Native invalidation, dependency bumps) takes >60min to reach the
      # embedded-framework signing phase, at which point codesign blocks forever
      # on the locked keychain (it posts an unlock dialog into the runner's GUI
      # session) — the recurring "Build iOS timed out" hang at
      # "Signing libswscale.framework". This watcher outlives its step, waits for
      # the keychain to appear, and re-clears its auto-lock every minute
      # (set-keychain-settings with no -t = never lock; no password needed while
      # the freshly created keychain is unlocked).
      - name: Defuse build-keychain auto-lock (background watcher)
        run: |
          nohup bash -c '
            kc="$HOME/Library/Keychains/ios-build.keychain-db"
            while true; do
              if [ -f "$kc" ]; then
                if security set-keychain-settings "$kc" 2>>"$RUNNER_TEMP/keychain-watcher.log"; then
                  echo "$(date -u +%FT%TZ) cleared auto-lock on $kc"
                fi
              fi
              sleep 60
            done
          ' >> "$RUNNER_TEMP/keychain-watcher.log" 2>&1 &
          echo "keychain watcher started (log: $RUNNER_TEMP/keychain-watcher.log)"

      - name: Build iOS
        timeout-minutes: 180
        uses: yukiarrr/ios-build-action@v1.12.0
        with:
          project-path: iosApp/iosApp.xcodeproj
          workspace-path: iosApp/iosApp.xcodeproj/project.xcworkspace
          scheme: iosApp
          export-options: iosApp/options-appstore.plist
          p12-base64: ${{ secrets.IOS_FEED_P12_BASE64 }}
          mobileprovision-base64: |
            ${{ secrets.FEED_IOS_MOBILE_PROVISION_BASE64 }}
            ${{ secrets.FEED_APP_GROUP_IOS_MOBILE_PROVISION_BASE64 }}
            ${{ secrets.FEED_NOTIFICATIONS_IOS_MOBILE_PROVISION_BASE64 }}
          code-signing-identity: "Apple Distribution"
          team-id: ${{ secrets.IOS_TEAM_ID }}
          certificate-password: ${{ secrets.IOS_FEED_CERTIFICATE_PASSWORD }}

      # Companion to "Apply iOS CI memory overrides": if the build OOMs again,
      # the heap dump + GC logs tell us what the live set actually is.
      # always(), not failure(): the no-devirt experiment needs the GC log from a
      # GREEN run to prove what the link's peak heap actually was.
      - name: Upload JVM OOM diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-jvm-oom-diagnostics
          path: /Users/runner/work/jvm-dumps
          if-no-files-found: ignore

      - name: Rename IPA
        run: mv output.ipa iosApp.ipa

      - uses: actions/upload-artifact@v6
        with:
          name: ios-app
          path: iosApp.ipa

      ## --- TestFlight Upload ---
      ## Uncomment when App Store Connect API key secrets are configured.
      ## Create an API key in App Store Connect (Users and Access > Integrations >
      ## App Store Connect API), then store:
      ##   APPSTORE_API_KEY_ID      — the Key ID
      ##   APPSTORE_API_ISSUER_ID   — the Issuer ID
      ##   APPSTORE_API_PRIVATE_KEY — contents of the .p8 file
      ##
      ## You will also need an App Store distribution provisioning profile stored
      ## as FEED_IOS_APPSTORE_PROVISION_BASE64, and change export-options above
      ## to iosApp/options-appstore.plist when publishing.

      # main/tags only: a workflow_dispatch on an experiment branch must never
      # push its IPA to TestFlight.
      - name: Setup App Store Connect API key
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p "${{ runner.temp }}/private_keys"
          echo "${{ secrets.APPSTORE_API_PRIVATE_KEY }}" > \
            "${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPSTORE_API_KEY_ID }}.p8"

      - name: Upload to TestFlight
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file iosApp.ipa \
            --apiKey "${{ secrets.APPSTORE_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_API_ISSUER_ID }}"
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys

  create-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          if-no-files-found: ignore

      - name: Create Github Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print release URL
        run: |
          echo "Release created:"
          echo "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
