name: Promote iOS Release to public

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "What's New text (blank = \"Bug fixes and improvements.\")"
        required: false
        default: ""

concurrency:
  group: mobile-release-ios-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Fastlane
        run: |
          gem install fastlane

      - name: Submit for review with Fastlane
        working-directory: ./iosApp
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          fastlane submit_for_review

      - name: Summary
        run: |
          echo "✅ Submitted for App Store review"