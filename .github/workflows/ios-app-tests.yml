name: iOS app tests

# The app-hosted XCTests (iosAppTests): what needs a real app on a simulator, such as the Photos library.
# A full app build, so it runs only when iOS code changes, and nightly on main.
on:
  pull_request:
    paths:
      - 'iosApp/**'
      - '**/src/nativeMain/**'
      - '**/src/appleMain/**'
      - '**/src/iosMain/**'
      - '**/diagnostics/**'
      - 'homebase-core/objc-entry-points.txt'
      - 'gradle/libs.versions.toml'
      - '**/build.gradle.kts'
      - '.github/workflows/ios-app-tests.yml'
  push:
    branches: [main]
    paths:
      - 'iosApp/**'
      - '**/src/nativeMain/**'
      - '**/src/appleMain/**'
      - '**/src/iosMain/**'
      - '**/diagnostics/**'
      - 'homebase-core/objc-entry-points.txt'
      - 'gradle/libs.versions.toml'
      - '**/build.gradle.kts'
      - '.github/workflows/ios-app-tests.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: iosAppTests on a simulator
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Cache Kotlin/Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Cache SQLCipher xcframework
        uses: actions/cache@v5
        with:
          path: ~/.cache/homebase-sqlcipher
          key: sqlcipher-${{ hashFiles('homebase-api/build.gradle.kts') }}
          restore-keys: |
            sqlcipher-

      # Minutes instead of the app build's tens: a Kotlin error fails here, and Xcode reuses the klibs.
      - name: Compile the Kotlin for the simulator
        run: ./gradlew :homebase-core:compileKotlinIosSimulatorArm64
        env:
          JDK_21: ${{ env.JAVA_HOME }}

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in ios for d in devices[k] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      # Debug framework: Dev.xcconfig asks for the release link, the slowest step of the iOS build.
      # Signed ad hoc, not unsigned: without its entitlements the app gets no Keychain (OSStatus -34018), so its
      # database can't open and launch crashes before any test runs.
      - name: Build for testing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/dd \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            KOTLIN_FRAMEWORK_BUILD_TYPE=debug \
            | tee build/xcodebuild-build.log | grep -E --line-buffered "error:|\*\* BUILD|\*\* TEST BUILD"
        env:
          JDK_21: ${{ env.JAVA_HOME }}

      # Installed first, then granted: a grant for an app that isn't installed yet didn't reach it.
      - name: Install the app and give it full Photos access
        run: |
          app=$(find build/dd/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$SIM_UDID" "$app"
          xcrun simctl privacy "$SIM_UDID" grant photos id.homebase.feed.dev
          sqlite3 ~/Library/Developer/CoreSimulator/Devices/$SIM_UDID/data/Library/TCC/TCC.db \
            "select * from access where client like '%homebase%'" || true
          xcrun simctl get_app_container "$SIM_UDID" id.homebase.feed.dev

      - name: Run iosAppTests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build/dd \
            -resultBundlePath build/iosAppTests.xcresult \
            -only-testing:iosAppTests/DisplayDecodeCheckTests \
            | tee build/xcodebuild-test.log | grep -E --line-buffered "Test Case|measured:|error:|failed|passed|\*\* TEST"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-app-test-results
          path: |
            build/iosAppTests.xcresult
            build/xcodebuild-test.log
            build/xcodebuild-build.log
          if-no-files-found: ignore
