name: Build Check

on:
  push:
    branches: [main]
  # Unfiltered: a stacked PR based on a feature branch gets no checks at all if
  # this is restricted to main, so a layer can reach merge never having compiled.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run unittests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Chrome
        # Required by Karma to run wasmJs tests headless.
        uses: browser-actions/setup-chrome@latest

      - name: Run JVM + Android unit tests
        # Unqualified `jvmTest` fans out to every subproject's jvmTest, so newly
        # added modules are covered automatically (no per-module allow-list to drift).
        # `testDebugUnitTest` runs the androidApp module's unit tests (jvmTest
        # doesn't reach those — androidApp has no jvm target).
        run: ./gradlew jvmTest testDebugUnitTest
        env:
          JDK_21: ${{ env.JAVA_HOME }}
          CI: true

      - name: Run wasmJs tests
        # ffmpeg.wasm assets are mirrored into wasmJsTest resources by the
        # `mirrorWebAppFfmpegAssetsForTest` task in homebase-api/build.gradle.kts
        # (see karma.config.d/01-ffmpeg.js). wasmJs gradle tasks don't support
        # Gradle's configuration-cache or parallel-project execution (KT-52074
        # and friends), hence the two flags below.
        run: ./gradlew :homebase-api:wasmJsTest :homebase-common:wasmJsTest --no-configuration-cache --no-parallel
        env:
          JDK_21: ${{ env.JAVA_HOME }}
          CI: true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()  # Run even if tests fail
        with:
          files: |
            **/build/test-results/jvmTest/TEST-*.xml
            **/build/test-results/testDebugUnitTest/TEST-*.xml
            **/build/test-results/wasmJsBrowserTest/TEST-*.xml
          # Branch protection on `main` requires the literal context "JVM Test Results".
          # The check now covers JVM + Android unit + wasmJs results in one publish; the
          # name stays as-is until the required-status-check list is updated.
          check_name: JVM Test Results

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 30

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            name: Android & Desktop
            build-command: |
              ./gradlew :androidApp:assembleDebug
              ./gradlew :desktopApp:createDistributable
          - os: macos-latest
            name: iOS
            build-command: ./gradlew :homebase-core:linkDebugFrameworkIosArm64
      fail-fast: false
    name: Build ${{ matrix.name }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Kotlin/Native
        if: matrix.os == 'macos-latest'
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run build command
        run: ${{ matrix.build-command }}
        env:
          JDK_21: ${{ env.JAVA_HOME }}

      # iOS simulator tests for homebase-api (and the NSE preview in homebase-notifshared) — covers FfmpegDecoderCommonTest (real FFmpegKit
      # via cinterop), FFmpegKitVideoDecoderNativeTest (polling/cancel paths driven by mock
      # bridges), and the full commonTest suite (sync/database/outbox/etc.).
      - name: Run iOS simulator tests
        if: ${{ matrix.name == 'iOS' }}
        run: ./gradlew :homebase-api:iosSimulatorArm64Test :homebase-notifshared:iosSimulatorArm64Test
        env:
          JDK_21: ${{ env.JAVA_HOME }}

      - name: Verify Android build artifact
        if: ${{ matrix.name == 'Android & Desktop' }}
        run: find androidApp/build/outputs/apk/debug -name "*.apk"

      - name: Upload Android artifact
        if: ${{ matrix.name == 'Android & Desktop' }}
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Verify Desktop build artifact
        if: ${{ matrix.name == 'Android & Desktop' }}
        run: test -d desktopApp/build/compose/binaries/main/app && ls desktopApp/build/compose/binaries/main/app

      - name: Desktop launch smoke test
        if: ${{ matrix.name == 'Android & Desktop' }}
        timeout-minutes: 6
        env:
          HOMEBASE_SMOKE_MARKER: ${{ runner.temp }}/homebase-smoke-ok
          SKIKO_RENDER_API: SOFTWARE
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb dbus-x11 >/dev/null
          set +e
          timeout 180 dbus-run-session -- xvfb-run -a -s "-screen 0 1280x800x24" \
            desktopApp/build/compose/binaries/main/app/homebase-chat/bin/homebase-chat > smoke.log 2>&1
          code=$?; set -e
          tail -200 smoke.log
          [ $code -eq 0 ] || { echo "::error::desktop app exited $code"; exit 1; }
          [ -f "$HOMEBASE_SMOKE_MARKER" ] || { echo "::error::no first-frame marker"; exit 1; }
          if grep -E "NoSuchMethodError|NoClassDefFoundError|NoSuchFieldError|AbstractMethodError|UnsatisfiedLinkError|IncompatibleClassChangeError" smoke.log ~/.homebase-chat-dev/logs/homebase.log 2>/dev/null; then echo "::error::linkage error"; exit 1; fi

      - name: Upload desktop smoke logs
        if: ${{ failure() && matrix.name == 'Android & Desktop' }}
        uses: actions/upload-artifact@v6
        with:
          name: desktop-smoke-logs
          path: |
            smoke.log
            ~/.homebase-chat-dev/logs/homebase.log
          if-no-files-found: ignore

      - name: Upload Desktop artifact
        if: ${{ matrix.name == 'Android & Desktop' }}
        uses: actions/upload-artifact@v6
        with:
          name: desktop-dist
          path: desktopApp/build/compose/binaries/main/app/

      - name: Verify iOS build artifact
        if: ${{ matrix.name == 'iOS' }}
        run: find homebase-core/build/bin/iosArm64/debugFramework -name "*.framework" | grep -q ".framework$"

      - name: Upload iOS artifact
        if: ${{ matrix.name == 'iOS' }}
        uses: actions/upload-artifact@v6
        with:
          name: ios-framework
          path: homebase-core/build/bin/iosArm64/debugFramework/*.framework
