name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run unittests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Gradle Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run JVM unit tests
        run: ./gradlew homebase-chat:jvmTest homebase-auth:jvmTest homebase-common:jvmTest homebase-api:jvmTest homebase-core:jvmTest --rerun-tasks
        env:
          JDK_21: ${{ env.JAVA_HOME }}
          CI: true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()  # Run even if tests fail
        with:
          files: |
            homebase-api/build/test-results/jvmTest/TEST-*.xml
            homebase-chat/build/test-results/jvmTest/TEST-*.xml
            homebase-auth/build/test-results/jvmTest/TEST-*.xml
            homebase-common/build/test-results/jvmTest/TEST-*.xml
          check_name: JVM Test Results

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            name: Android & Desktop
            build-command: |
              ./gradlew :androidApp:assembleDebug
              ./gradlew :desktopApp:createDistributable
          - os: macos-latest
            name: iOS
            build-command: ./gradlew :homebase-core:linkDebugFrameworkIosArm64
      fail-fast: false
    name: Build ${{ matrix.name }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Gradle Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run build command
        run: ${{ matrix.build-command }}
        env:
          JDK_21: ${{ env.JAVA_HOME }}

      - name: Verify Android build artifact
        if: ${{ matrix.name == 'Android & Desktop' }}
        run: find androidApp/build/outputs/apk/debug -name "*.apk"

      - name: Upload Android artifact
        if: ${{ matrix.name == 'Android & Desktop' }}
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Verify Desktop build artifact
        if: ${{ matrix.name == 'Android & Desktop' }}
        run: test -d desktopApp/build/compose/binaries/main/app && ls desktopApp/build/compose/binaries/main/app

      - name: Upload Desktop artifact
        if: ${{ matrix.name == 'Android & Desktop' }}
        uses: actions/upload-artifact@v6
        with:
          name: desktop-dist
          path: desktopApp/build/compose/binaries/main/app/

      - name: Verify iOS build artifact
        if: ${{ matrix.name == 'iOS' }}
        run: find homebase-core/build/bin/iosArm64/debugFramework -name "*.framework" | grep -q ".framework$"

      - name: Upload iOS artifact
        if: ${{ matrix.name == 'iOS' }}
        uses: actions/upload-artifact@v6
        with:
          name: ios-framework
          path: homebase-core/build/bin/iosArm64/debugFramework/*.framework
