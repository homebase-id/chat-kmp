name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run unittests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Gradle Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run JVM unit tests
        # Unqualified `jvmTest` fans out to every subproject's jvmTest, so newly
        # added modules are covered automatically (no per-module allow-list to drift).
        run: ./gradlew jvmTest
        env:
          JDK_21: ${{ env.JAVA_HOME }}
          CI: true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()  # Run even if tests fail
        with:
          files: |
            **/build/test-results/jvmTest/TEST-*.xml
          check_name: JVM Test Results

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            name: Android & Desktop
            build-command: |
              ./gradlew :androidApp:assembleDebug
              ./gradlew :desktopApp:createDistributable
          - os: macos-latest
            name: iOS
            build-command: ./gradlew :homebase-core:linkDebugFrameworkIosArm64
      fail-fast: false
    name: Build ${{ matrix.name }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Gradle Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Kotlin/Native
        if: matrix.os == 'macos-latest'
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/gradle.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run build command
        run: ${{ matrix.build-command }}
        env:
          JDK_21: ${{ env.JAVA_HOME }}

      # iOS simulator tests for homebase-api — covers FfmpegDecoderCommonTest (real FFmpegKit
      # via cinterop) and FFmpegKitVideoDecoderNativeTest (polling/cancel paths driven by
      # mock bridges). The dedicated `test.yml` workflow is disabled in repo settings; running
      # the iOS sim test here keeps the iOS-specific test coverage executing on every PR.
      - name: Run iOS simulator tests
        if: ${{ matrix.name == 'iOS' }}
        run: ./gradlew :homebase-api:iosSimulatorArm64Test
        env:
          JDK_21: ${{ env.JAVA_HOME }}

      - name: Verify Android build artifact
        if: ${{ matrix.name == 'Android & Desktop' }}
        run: find androidApp/build/outputs/apk/debug -name "*.apk"

      - name: Upload Android artifact
        if: ${{ matrix.name == 'Android & Desktop' }}
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/debug/*.apk

      - name: Verify Desktop build artifact
        if: ${{ matrix.name == 'Android & Desktop' }}
        run: test -d desktopApp/build/compose/binaries/main/app && ls desktopApp/build/compose/binaries/main/app

      - name: Upload Desktop artifact
        if: ${{ matrix.name == 'Android & Desktop' }}
        uses: actions/upload-artifact@v6
        with:
          name: desktop-dist
          path: desktopApp/build/compose/binaries/main/app/

      - name: Verify iOS build artifact
        if: ${{ matrix.name == 'iOS' }}
        run: find homebase-core/build/bin/iosArm64/debugFramework -name "*.framework" | grep -q ".framework$"

      - name: Upload iOS artifact
        if: ${{ matrix.name == 'iOS' }}
        uses: actions/upload-artifact@v6
        with:
          name: ios-framework
          path: homebase-core/build/bin/iosArm64/debugFramework/*.framework
