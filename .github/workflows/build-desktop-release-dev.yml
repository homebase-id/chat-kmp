name: Build Desktop Release Dev

on:
  # Run on schedule (every day at 2 AM UTC)
  schedule:
    - cron: '0 2 * * *'  # Adjust time as needed

  # Allow manual triggering from GitHub UI
  workflow_dispatch:

concurrency:
  group: desktop-release-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Conveyor installation
        id: cache-conveyor
        uses: actions/cache@v5
        with:
          path: .conveyor/install
          key: conveyor-22.0-linux-amd64

      - name: Download Conveyor
        if: steps.cache-conveyor.outputs.cache-hit != 'true'
        shell: bash
        run: |
          wget https://downloads.hydraulic.dev/conveyor/conveyor-22.0-linux-amd64.tar.gz
          mkdir -p .conveyor/install
          tar xzvf conveyor-22.0-linux-amd64.tar.gz -C .conveyor/install

      - name: Cache Conveyor data
        uses: actions/cache@v5
        with:
          key: conveyor-data-${{ github.run_id }}
          path: .conveyor/cache
          restore-keys: conveyor-data

      - name: Read version info
        id: version
        run: |
          VERSION_NAME=$(grep 'version.name=' gradle/version.properties | cut -d'=' -f2)
          BASE=$(grep 'version.code.base=' gradle/version.properties | cut -d'=' -f2)
          VERSION_CODE=$((BASE + ${{ github.run_number }}))
          # Extract MAJOR.MINOR from version.name (e.g., 1.3.0 -> 1.3)
          MAJOR_MINOR=$(echo $VERSION_NAME | cut -d'.' -f1-2)
          # Create version like 1.3.1202 (use VERSION_CODE as patch)
          FULL_VERSION="${MAJOR_MINOR}.${VERSION_CODE}"
          echo "VERSION_NAME=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $FULL_VERSION ($VERSION_CODE)"
          
          # Update version.properties with the full version
          sed -i "s/^version.name=.*/version.name=$FULL_VERSION/" gradle/version.properties
          
          echo "Updated version.properties:"
          cat gradle/version.properties         

      - name: Build binaries
        working-directory: ./desktopApp
        run: ./gradlew clean createReleaseDistributable
        env:
          JDK_21: ${{ env.JAVA_HOME }}

      - name: Run Conveyor
        working-directory: ./desktopApp
        env:
          CONVEYOR_GITHUB_TOKEN: ${{ secrets.CONVEYOR_DESKTOP_DEV_GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          CONVEYOR_AGREE_TO_LICENSE: 1
          JDK_21: ${{ env.JAVA_HOME }}
        shell: bash
        run: |
          PATH="$PATH:../.conveyor/install/conveyor-22.0/bin"
          conveyor --cache-dir="../.conveyor/cache" "-Kapp.signing-key=$SIGNING_KEY" -f ci.conveyor.conf make site

      - name: Create release in bleeding repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CONVEYOR_DESKTOP_DEV_GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = '${{ steps.version.outputs.VERSION_NAME }}';
            const owner = 'homebase-id';  
            const repo = 'chat-desktop-release-bleeding/releases';
            const outputDir = path.join(process.cwd(), 'desktopApp', 'output');
            
            console.log(`Creating release v${version} in ${owner}/${repo}`);
            
            // Get the latest commit SHA from the target repo
            const { data: refData } = await github.rest.git.getRef({
              owner: owner,
              repo: repo,
              ref: 'heads/main'
            });
            const targetSha = refData.object.sha;
            
            // Create tag
            try {
              await github.rest.git.createRef({
                owner: owner,
                repo: repo,
                ref: `refs/tags/v${version}`,
                sha: targetSha
              });
              console.log(`Created tag v${version}`);
            } catch (error) {
              if (error.message.includes('Reference already exists')) {
                console.log(`Tag v${version} already exists, continuing...`);
              } else {
                throw error;
              }
            }
            
            // Create release
            const { data: release } = await github.rest.repos.createRelease({
              owner: owner,
              repo: repo,
              tag_name: `v${version}`,
              name: `Desktop Dev v${version}`,
              body: `Desktop development release v${version}\n\nBuilt from ${context.repo.owner}/${context.repo.repo}@${context.sha.substring(0, 7)}`,
              draft: false,
              prerelease: false  // Set to false for production releases
            });
            
            console.log(`Created release: ${release.html_url}`);
            
            // Upload all files from output directory
            if (!fs.existsSync(outputDir)) {
              console.log(`Output directory ${outputDir} does not exist`);
              return;
            }
            
            const files = fs.readdirSync(outputDir);
            console.log(`Found ${files.length} files in output directory`);
            
            for (const file of files) {
              const filePath = path.join(outputDir, file);
              const stats = fs.statSync(filePath);
            
              if (stats.isFile()) {
                console.log(`Uploading ${file} (${(stats.size / 1024 / 1024).toFixed(2)} MB)...`);
            
                const fileContent = fs.readFileSync(filePath);
            
                await github.rest.repos.uploadReleaseAsset({
                  owner: owner,
                  repo: repo,
                  release_id: release.id,
                  name: file,
                  data: fileContent
                });
            
                console.log(`✓ Uploaded ${file}`);
              }
            }
            
            console.log(`\nRelease complete: ${release.html_url}`);
          
          
