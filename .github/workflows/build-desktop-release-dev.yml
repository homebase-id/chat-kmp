name: Build Desktop Dev Release

on:
  # Run on schedule (every day at 2 AM UTC)
  schedule:
    - cron: '0 2 * * *'  # Adjust time as needed

  # Allow manual triggering from GitHub UI
  workflow_dispatch:

  push:
    branches: [ main, desktopOptimizations ]


concurrency:
  group: desktop-release-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Conveyor installation
        id: cache-conveyor
        uses: actions/cache@v4
        with:
          path: .conveyor/install
          key: conveyor-22.0-linux-amd64

      - name: Download Conveyor
        if: steps.cache-conveyor.outputs.cache-hit != 'true'
        shell: bash
        run: |
          wget https://downloads.hydraulic.dev/conveyor/conveyor-22.0-linux-amd64.tar.gz
          mkdir -p .conveyor/install
          tar xzvf conveyor-22.0-linux-amd64.tar.gz -C .conveyor/install

      - name: Cache Conveyor data
        uses: actions/cache@v4
        with:
          key: conveyor-data-${{ github.run_id }}
          path: .conveyor/cache
          restore-keys: conveyor-data

      - name: Read version info
        id: version

        run: |
          VERSION_NAME=$(grep 'version.name=' gradle/version.properties | cut -d'=' -f2)
          BASE=$(grep 'version.code.base=' gradle/version.properties | cut -d'=' -f2)
          VERSION_CODE=$((BASE + ${{ github.run_number }}))
          # Extract MAJOR.MINOR from version.name (e.g., 1.3.0 -> 1.3)
          MAJOR_MINOR=$(echo $VERSION_NAME | cut -d'.' -f1-2)
          # Create version like 1.3.1202 (use VERSION_CODE as patch)
          FULL_VERSION="${MAJOR_MINOR}.${VERSION_CODE}"
          echo "VERSION_NAME=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $FULL_VERSION ($VERSION_CODE)"               

      - name: Build binaries
        working-directory: ./desktopApp
        run: ./gradlew clean createReleaseDistributable
        env:
          JDK_21: ${{ env.JAVA_HOME }}

      - name: Run Conveyor
        working-directory: ./desktopApp
        env:
          CONVEYOR_GITHUB_TOKEN: ${{ secrets.CONVEYOR_DESKTOP_DEV_GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          CONVEYOR_AGREE_TO_LICENSE: 1
          JDK_21: ${{ env.JAVA_HOME }}
          APP_VERSION: ${{ steps.version.outputs.VERSION_NAME }}
        shell: bash
        run: |
          PATH="$PATH:../.conveyor/install/conveyor-22.0/bin"
          conveyor --cache-dir="../.conveyor/cache" "-Kapp.signing-key=$SIGNING_KEY" -f ci.conveyor.conf make copied-site          
