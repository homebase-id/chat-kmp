name: Promote Android Release to public

on:
  workflow_dispatch:
    inputs:
      fromTrack:
        description: 'From track'
        required: true
        default: 'internal'
      promoteTrack:
        description: 'To track'
        required: true
        default: 'production'

concurrency:
  group: mobile-release-android-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Create Google Play Service Account JSON
        run: |
          echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_DEV }}' > google-play-key.json

      - name: "Publish to Google Play public release"
        run: ./gradlew promoteReleaseArtifact --from-track ${{ github.event.inputs.fromTrack }} --promote-track ${{ github.event.inputs.promoteTrack }} --release-status completed

      - name: Summary
        run: |
          echo "Promoted release from ${{ github.event.inputs.fromTrack }} to ${{ github.event.inputs.promoteTrack }}"
          echo ""
            echo "Next steps:"
            echo "1. Verify the release in the Google Play Console: https://play.google.com/console/developers/ [Your App] > Release > Production"
            echo "2. Monitor the release rollout and user feedback"