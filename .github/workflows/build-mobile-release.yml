name: Build Mobile Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Homebase Keystore
        id: decode_keystore
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64_ENCODED }}
        run: |
          TMP_KEYSTORE_FILE_PATH="${RUNNER_TEMP}/keystore"
          mkdir "${TMP_KEYSTORE_FILE_PATH}"
          KEYSTORE_FILE_PATH="${TMP_KEYSTORE_FILE_PATH}/homebase.keystore"
          echo $ENCODED_STRING | base64 -d > "${KEYSTORE_FILE_PATH}"
          echo "KEYSTORE_FILE_PATH=$KEYSTORE_FILE_PATH" >> $GITHUB_OUTPUT

      - name: Build Android Bundle
        run: |
          VERSION_CODE=$((403 + ${{ github.run_number }}))
          VERSION_NAME="${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"

          echo "VERSION_CODE=$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME"

          ./gradlew --no-daemon :androidApp:bundleRelease \
            -PVERSION_CODE=$VERSION_CODE \
            -PVERSION_NAME="$VERSION_NAME"
        env:
          SIGNING_KEYSTORE_FILE_PATH: ${{ steps.decode_keystore.outputs.KEYSTORE_FILE_PATH }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}

      - name: Rename output
        run: |
          mv androidApp/build/outputs/bundle/release/androidApp-release.aab \
             androidApp/build/outputs/bundle/release/homebase-id-app.aab

      - uses: actions/upload-artifact@v4
        with:
          name: homebase-id-app-android
          path: androidApp/build/outputs/bundle/release/homebase-id-app.aab


  build-ios:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            iosApp/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Set iOS version
        run: |
          VERSION_CODE=$((403 + ${{ github.run_number }}))
          VERSION_NAME="${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"

          echo "Setting iOS version to $VERSION_NAME ($VERSION_CODE)"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" iosApp/iosApp/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION_CODE" iosApp/iosApp/Info.plist

      - name: Build iOS
        uses: yukiarrr/ios-build-action@v1.12.0
        with:
          project-path: iosApp/iosApp.xcodeproj
          workspace-path: iosApp/iosApp.xcodeproj/project.xcworkspace
          scheme: iosApp
          export-options: iosApp/options.plist
          p12-base64: ${{ secrets.IOS_FEED_P12_BASE64 }}
          mobileprovision-base64: ${{ secrets.FEED_IOS_MOBILE_PROVISION_BASE64 }}
          code-signing-identity: "Apple Distribution"
          team-id: ${{ secrets.IOS_TEAM_ID }}
          certificate-password: ${{ secrets.IOS_FEED_CERTIFICATE_PASSWORD }}

      - name: Rename IPA
        run: mv output.ipa iosApp.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: iosApp.ipa


  create-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Github Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/homebase-id-app-android/homebase-id-app.aab
            artifacts/ios-app/iosApp.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}