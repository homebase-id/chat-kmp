name: Desktop Keystore

on:
  pull_request:
    paths:
      - "homebase-api/src/jvm*/**/storage/**"
      - ".github/workflows/desktop-keystore.yml"
  push:
    branches: [main]
    paths:
      - "homebase-api/src/jvm*/**/storage/**"
      - ".github/workflows/desktop-keystore.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HOMEBASE_REAL_KEYSTORE: "1"
  APP_BUILD_TIME: ci

jobs:
  linux-secret-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Install libsecret and GNOME Keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-0 gnome-keyring dbus-x11
      - name: Run the real key store test against an unlocked keyring
        run: |
          dbus-run-session -- bash -c '
            echo -n "" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            ./gradlew :homebase-api:jvmTest --tests "id.homebase.api.storage.OsKeyStoreRealTest" --no-configuration-cache
          '

  windows-dpapi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Run the real DPAPI test
        run: ./gradlew :homebase-api:jvmTest --tests "id.homebase.api.storage.OsKeyStoreRealTest" --no-configuration-cache
        shell: bash

  macos-keychain:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Run the real Keychain test
        run: ./gradlew :homebase-api:jvmTest --tests "id.homebase.api.storage.OsKeyStoreRealTest" --no-configuration-cache
