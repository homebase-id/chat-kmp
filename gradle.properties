# --- Kotlin & Android ---
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8g
android.useAndroidX=true
android.nonTransitiveRClass=true
# --- Kotlin Multiplatform (KMP) ---
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.enableIntransitiveMetadataConfiguration=true
org.jetbrains.compose.experimental.uikit.enabled=true
# --- Kotlin/Native Optimizations ---
kotlin.incremental.native=false  # EXPERIMENT: was true; disable to avoid K/N cache-state phase-ordering crash
kotlin.native.disableCompilerDaemon=false
kotlin.native.linkerOptions=-dead_strip
kotlin.native.cocoapods.generate.wrapper=true
# Cap Konan worker threads to match macOS GitHub runner vCPU count (3) so the
# build doesn't context-switch four threads across three cores. Local dev
# machines almost always have >=4 cores so this only narrows when host==CI.
kotlin.native.gradle.workers.max=3
# --- Gradle Performance ---
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.parallel=true
# Configuration on Demand is unsupported by Kotlin/Wasm targets (KT-52074) and triggers
# "configuration resolved without an exclusive lock" failures on the wasmJs npm tasks. Disabled
# project-wide; the cost is negligible because configuration is cached (configuration-cache below).
org.gradle.configureondemand=false
org.gradle.configuration-cache=true
# --- Robolectric ---
robolectric.enabledSdks=33