include required("conveyor_common.conf")

app {
  // The base URL is where the download site will be placed. Packages will check here for updates.
  site {
    base-url = "https://github.com/homebase-id/chat-desktop-release-production/releases/latest/download"
    github.oauth-token = ${env.CONVEYOR_GITHUB_TOKEN}
  }

  // This is optional. If not specified the last component of the rdns name will be turned into a display name.
  display-name = "Homebase Chat"
  vendor = "Homebase"
  contact-email = "apps@vidence.co"

  // A global identifier for the app.
  rdns-name = "id.homebase.feed"

  jvm {
    system-properties {
      "app.rdns.name" = "id.homebase.feed"
    }
  }

  windows {
    signing-key {
      azure-trusted-signing {
        endpoint = "eus.codesigning.azure.net"
        api-access-token = ${env.AZURE_ACCESS_TOKEN}
      }
    }
    signing-key-alias = "Homebase/Homebase Certificate"
  }

  mac {

     #deltas = 2
     #certificate = ${env.APPLE_SIGNING_KEY}

     #signing-key.file = {
     #  path = ${env.APPLE_SIGNING_KEY}
     #  password = ${env.APPLE_SIGNING_KEY_PASS}
     #}

     #notarization {
     #   issuer-id = ${env.APPLE_SIGNING_ISSUER_ID}
     #   key-id = ${env.APPLE_SIGNING_KEY_ID}
     #   private-key = ${env.APPLE_NOTARIZATION_KEY}
     #}
  }
}
