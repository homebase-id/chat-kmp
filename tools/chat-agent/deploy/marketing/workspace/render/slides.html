<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homebase slides</title>
<style>
@font-face { font-family: "Montserrat Alternates"; src: url(../brand/fonts/Montserrat_Alternates/MontserratAlternates-Light.ttf); font-weight: 300; }
@font-face { font-family: "Montserrat Alternates"; src: url(../brand/fonts/Montserrat_Alternates/MontserratAlternates-Bold.ttf); font-weight: 700; }
@font-face { font-family: "Montserrat"; src: url(../brand/fonts/Montserrat/Montserrat-VariableFont_wght.ttf); font-weight: 100 900; }

/* brand/BRAND.md */
:root {
  --purple: #603E90;
  --blue: #425985;
  --blue-2: #476A92;
  --green: #00966D;
  --accent: #EB00EB;
  --purple-50: #AF9EC7;
  --ink: #000000;
  --ink-soft: #3B3B46;
  --ink-faint: #6E6E7A;
  --surface: #F4F1F8;
  --surface-high: #E9E4F1;
  --hairline: #DCD5E7;
  --background: #FFFFFF;
  --head: "Montserrat Alternates", sans-serif;
  --body: "Montserrat", sans-serif;
}
@page { size: 1080px 1350px; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--background); }
body { font-family: var(--body); color: var(--ink); -webkit-font-smoothing: antialiased; }

.slide {
  position: relative; width: 1080px; height: 1350px; overflow: hidden;
  display: flex; flex-direction: column;
  padding: 88px 88px 64px 96px;
  background: var(--background);
  break-after: page;
}

.top { display: flex; justify-content: space-between; align-items: baseline; font: 500 24px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); }
.title { margin-top: 56px; font: 300 64px/1.12 var(--head); letter-spacing: -0.01em; text-wrap: balance; }
.hl { font-weight: 700; color: var(--purple); }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; padding: 48px 0; }
.subtitle { margin-top: 20px; font-size: 32px; line-height: 1.4; color: var(--ink-soft); }

.foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 48px; padding-top: 28px; border-top: 2px solid var(--hairline); }
.brand { display: flex; align-items: center; gap: 16px; font: 700 30px/1 var(--head); flex: none; }
.brand img { width: 52px; height: 52px; border-radius: 10px; }
.source { font: 500 20px/1.45 var(--body); color: var(--ink-faint); text-align: right; max-width: 640px; }

.value { font: 700 220px/.95 var(--head); letter-spacing: -0.04em; color: var(--purple); }
.label { margin-top: 36px; font-size: 44px; line-height: 1.25; font-weight: 600; max-width: 820px; }
.note { margin-top: 28px; font-size: 34px; line-height: 1.45; color: var(--ink-soft); max-width: 820px; }

.points { display: flex; flex-direction: column; }
.point { display: grid; grid-template-columns: 88px 1fr; padding: 32px 0; border-top: 2px solid var(--hairline); }
.point:first-child { border-top: 0; padding-top: 0; }
.point .n { font: 700 32px/1.3 var(--head); color: var(--green); }
.point h3 { font-size: 40px; line-height: 1.2; font-weight: 700; }
.point p { margin-top: 12px; font-size: 32px; line-height: 1.45; color: var(--ink-soft); }

.tiles { display: flex; flex-direction: column; gap: 24px; }
.tile { display: grid; grid-template-columns: 320px 1fr; align-items: center; gap: 32px; padding: 36px 40px; border-radius: 24px; background: var(--surface); }
.tile .v { font: 700 96px/1 var(--head); letter-spacing: -0.03em; color: var(--purple); }
.tile .l { font-size: 32px; line-height: 1.35; }

.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.col { border-radius: 24px; padding: 40px 36px; background: var(--surface-high); }
.col + .col { background: var(--purple); color: #fff; }
.col h3 { font: 700 26px/1 var(--head); margin-bottom: 28px; }
.col li { list-style: none; font-size: 32px; line-height: 1.4; padding: 18px 0; border-top: 2px solid color-mix(in srgb, currentColor 16%, transparent); }
.col li:first-child { border-top: 0; padding-top: 0; }

.statement { border-left: 10px solid var(--green); padding-left: 48px; }
.statement .big { font: 300 68px/1.15 var(--head); }
.statement p { font-size: 34px; line-height: 1.5; color: var(--ink-soft); margin-top: 36px; }

.photo { flex: 1; min-height: 0; margin: 48px 0; border-radius: 28px; background-size: cover; background-position: center; }

.slide.l-cover, .slide.l-end { background: linear-gradient(160deg, var(--purple) 0%, var(--blue) 100%); color: #fff; }
.l-cover .top, .l-end .top, .l-cover .source, .l-end .source { color: rgba(255,255,255,.75); }
.l-cover .title { margin-top: auto; font-size: 100px; line-height: 1.04; }
.l-cover .hl, .l-end .hl { color: #fff; }
.l-cover .sub, .l-end .sub { margin-top: 40px; font-size: 40px; line-height: 1.35; color: rgba(255,255,255,.85); max-width: 840px; }
.l-cover .foot, .l-end .foot { border-top-color: rgba(255,255,255,.25); margin-top: 72px; }
.l-cover.has-photo { background-size: cover; background-position: center; }
.l-cover.has-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(96,62,144,.15) 0%, rgba(66,89,133,.92) 70%); }
.l-cover.has-photo > * { position: relative; z-index: 1; }
.l-end .title { font-size: 84px; margin-top: auto; }
.cta { margin-top: 56px; display: inline-flex; align-self: flex-start; padding: 22px 34px; border-radius: 999px; background: #fff; color: var(--purple); font: 700 30px/1 var(--head); }
</style>
</head>
<body>
<script>
// One .slide per spec entry. Text goes in via textContent; **x** becomes a highlight.
const LOGO = "../brand/logos/homebase_org_rgb_2.svg";
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) rich(n, String(text));
  return n;
};
function rich(node, text) {
  text.split("**").forEach((part, i) => {
    if (!part) return;
    if (i % 2) { const s = document.createElement("strong"); s.className = "hl"; s.textContent = part; node.append(s); }
    else node.append(part);
  });
}
const photoUrl = (p) => `url("${p}")`;

const layouts = {
  cover(s, slide, t) { if (s.sub) t.after(el("p", "sub", s.sub)); if (s.photo) { slide.classList.add("has-photo"); slide.style.backgroundImage = photoUrl(s.photo); } },
  stat(s, b) { b.append(el("div", "value", s.value), el("div", "label", s.label)); if (s.note) b.append(el("p", "note", s.note)); },
  points(s, b) {
    const list = el("div", "points");
    s.points.forEach((p, i) => {
      const row = el("div", "point"), txt = el("div");
      txt.append(el("h3", null, p.head));
      if (p.body) txt.append(el("p", null, p.body));
      row.append(el("div", "n", String(i + 1).padStart(2, "0")), txt);
      list.append(row);
    });
    b.append(list);
  },
  tiles(s, b) {
    const list = el("div", "tiles");
    s.tiles.forEach(t => { const row = el("div", "tile"); row.append(el("div", "v", t.value), el("div", "l", t.label)); list.append(row); });
    b.append(list);
  },
  compare(s, b) {
    const grid = el("div", "compare");
    [s.left, s.right].forEach(c => {
      const col = el("div", "col"), ul = el("ul");
      col.append(el("h3", null, c.head));
      c.items.forEach(t => ul.append(el("li", null, t)));
      col.append(ul);
      grid.append(col);
    });
    b.append(grid);
  },
  statement(s, b) { const box = el("div", "statement"); box.append(el("p", "big", s.quote)); if (s.body) box.append(el("p", null, s.body)); b.append(box); },
  photo(s, b) { const p = el("div", "photo"); p.style.backgroundImage = photoUrl(s.photo); b.replaceWith(p); },
  end(s, slide, t) { if (s.sub) t.after(el("p", "sub", s.sub)); if (s.cta) slide.insertBefore(el("div", "cta", s.cta), slide.querySelector(".foot")); },
};

function render(spec) {
  document.body.replaceChildren();
  const total = spec.slides.length;
  spec.slides.forEach((s, i) => {
    if (!layouts[s.layout]) throw new Error(`slide ${i + 1}: unknown layout "${s.layout}"`);
    const slide = el("section", "slide l-" + s.layout);
    const top = el("div", "top");
    top.append(el("span", null, s.kicker ?? spec.kicker ?? ""), el("span", null, total > 1 ? `${String(i + 1).padStart(2, "0")} / ${String(total).padStart(2, "0")}` : ""));
    const title = el("h2", "title", s.title);
    slide.append(top, title);
    const solo = s.layout === "cover" || s.layout === "end";
    if (s.sub && !solo) slide.append(el("p", "subtitle", s.sub));
    const body = el("div", "body");
    const foot = el("div", "foot"), brand = el("div", "brand"), img = el("img");
    img.src = LOGO; img.alt = "";
    brand.append(img, "homebase.id");
    foot.append(brand, el("div", "source", s.source ? "Source: " + s.source : ""));
    if (solo) { slide.append(foot); layouts[s.layout](s, slide, title); }
    else { slide.append(body, foot); layouts[s.layout](s, body); }
    document.body.append(slide);
  });
}

function overflows() {
  const out = [];
  document.querySelectorAll(".slide").forEach((slide, i) => {
    const box = slide.getBoundingClientRect();
    slide.querySelectorAll("*").forEach(n => {
      const r = n.getBoundingClientRect();
      if (r.width && (r.bottom > box.bottom - 40 || r.right > box.right - 40 || r.left < box.left))
        out.push(`slide ${i + 1}: "${(n.textContent || n.tagName).trim().slice(0, 50)}" runs outside the slide`);
    });
    const body = slide.querySelector(".body");
    if (body && body.scrollHeight > body.clientHeight + 1) out.push(`slide ${i + 1}: content is too tall; cut words or split the slide`);
  });
  return [...new Set(out)];
}
</script>
</body>
</html>
