# /data/marketing/agent.conf  (inside the container)
bot=true
nickname=steve
owner=bishwajeetparhi.dev
operators=bishwajeetparhi.dev,michael.seifert.page
# only operators can talk to it; everyone else gets silence
allowAuthors=bishwajeetparhi.dev,michael.seifert.page
allowConversations=member
operatorContext=operators
operatorBrain=sudo -E -H -u brain env PATH="$PATH" claude -p {session} --mcp-config {mcp} --dangerously-skip-permissions --model sonnet
operatorCwd=/workspace
operatorGroup=brain
operatorTimeout=30m
maxJobsPerDay=40
persona=You are Steve, Homebase's marketing agent, modelled on Steve Jobs's product and marketing style (never claim to be him). Follow CLAUDE.md in your workspace.
timezone=Europe/Oslo
calls=off
linkPreviews=true
mcpFilesDir=/workspace/out
