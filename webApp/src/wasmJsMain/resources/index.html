<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- The base href below is substituted at build time from the -PpublicPath Gradle property (default "/"). -->
    <base href="@PUBLIC_PATH@">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json"/>

    <title>Homebase Chat</title>

    <script type="text/javascript">
        // TODO required for ktor client
        window.process = {
            env: {},
            release: {}
        };
    </script>

    <style>
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #000;
            }
        }

        @media (prefers-color-scheme: light) {
            body {
                background-color: #FFF;
            }
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-repeat: no-repeat;
            background-position: center;
        }

        #ComposeApp {
            margin-top: env(safe-area-inset-top);
            margin-bottom: env(safe-area-inset-bottom);
            margin-left: env(safe-area-inset-left);
            margin-right: env(safe-area-inset-right);
            height: calc(100% - env(safe-area-inset-top));
            width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));
        }

        #splash {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            transition: opacity 200ms ease-out;
        }

        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #splash-spinner {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid transparent;
            animation: splash-spin 900ms linear infinite;
        }

        #splash-bar {
            width: 220px;
            max-width: 60vw;
            height: 3px;
            border-radius: 2px;
            overflow: hidden;
        }

        #splash-bar-fill {
            width: 0;
            height: 100%;
            border-radius: 2px;
            transition: width 250ms ease-out;
        }

        #splash-error {
            max-width: 420px;
            line-height: 1.5;
        }

        #splash.failed #splash-spinner,
        #splash.failed #splash-bar {
            display: none;
        }

        @keyframes splash-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            #splash-spinner { animation-duration: 2.4s; }
            #splash-bar-fill { transition: none; }
        }

        @media (prefers-color-scheme: light) {
            #splash { background-color: #FFF; color: #5F6368; }
            #splash-spinner { border-top-color: #1A73E8; border-right-color: #1A73E8; }
            #splash-bar { background-color: #E8EAED; }
            #splash-bar-fill { background-color: #1A73E8; }
            #splash-error { color: #C5221F; }
        }

        @media (prefers-color-scheme: dark) {
            #splash { background-color: #000; color: #9AA0A6; }
            #splash-spinner { border-top-color: #8AB4F8; border-right-color: #8AB4F8; }
            #splash-bar { background-color: #2A2A2A; }
            #splash-bar-fill { background-color: #8AB4F8; }
            #splash-error { color: #F28B82; }
        }
    </style>
</head>
<body>
<div id="splash" role="status" aria-live="polite">
    <div id="splash-spinner"></div>
    <div id="splash-stage">Starting…</div>
    <div id="splash-bar"><div id="splash-bar-fill"></div></div>
    <div id="splash-error" hidden></div>
</div>
<div id="ComposeApp"></div>

<script type="application/javascript">
    // Boot progress for the pre-first-frame window. The bundle download and wasm compile are
    // reported from the loader below; everything after main() enters is reported from Kotlin
    // (main.wasm.kt) through these same three globals.
    (function () {
        window.__homebaseBoot = function (label, percent) {
            var stage = document.getElementById("splash-stage");
            var fill = document.getElementById("splash-bar-fill");
            if (stage && label) stage.textContent = label;
            if (fill && typeof percent === "number") fill.style.width = percent + "%";
        };

        window.__homebaseBootDone = function () {
            var splash = document.getElementById("splash");
            if (splash == null) return;
            window.__homebaseBoot(null, 100);
            // Two frames: the first commits Compose's initial paint, the second starts the fade
            // against it, so the canvas is never revealed mid-composition.
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    splash.classList.add("hidden");
                    setTimeout(function () { splash.remove(); }, 250);
                });
            });
        };

        window.__homebaseBootError = function (message) {
            var splash = document.getElementById("splash");
            if (splash == null) return;
            splash.classList.add("failed");
            var stage = document.getElementById("splash-stage");
            if (stage) stage.textContent = "Homebase Chat couldn't start";
            var error = document.getElementById("splash-error");
            if (error) {
                error.hidden = false;
                error.textContent = message;
            }
        };
    })();
</script>
<script type="application/javascript">
    const unhandledError = (event, error) => {
        if (error instanceof WebAssembly.CompileError) {
            window.__homebaseBootError(
                "This browser can't run WebAssembly modules this app needs. " +
                "Try the latest Chrome, Edge, Firefox or Safari."
            );

            // Hide a Scary Webpack Overlay which is less informative in this case.
            const webpackOverlay = document.getElementById("webpack-dev-server-client-overlay");
            if (webpackOverlay != null) webpackOverlay.style.display = "none";
        }
    }
    addEventListener("error", (event) => unhandledError(event, event.error));
    addEventListener("unhandledrejection", (event) => unhandledError(event, event.reason));
</script>

<script type="application/javascript">
    if (typeof self.crypto.randomUUID == "undefined") {
        self.crypto.randomUUID = () => {
            let count = 16;
            const array = new Uint8Array(count);
            const h = Array.from(self.crypto.getRandomValues(array)).map((v) => (v < 16 ? "0" : "") + v.toString(16))
            let prev = 0;

            // 36b8f84d-df4e-4d49-b662-bcde71a8764f
            return [4, 2, 2, 2, 6].map((v) => {
                const start = prev
                prev += v
                return h.slice(start, start + v).join("")
            }).join("-")
        };
    }
    self.supportsNotifications = (typeof Notification != "undefined");
    if (typeof Notification == "undefined") {
        self.Notification = class Notification {
            static permission = "default";
            static requestPermission(callback/*: (permission) => void*/) {
                callback("default");
            }
        }
    }
</script>

<script type="application/javascript">
    // YouAuth runs in a popup this app opened. After the owner console authenticates the user it
    // redirects the popup to <origin>/authorization-code-callback?state=...&identity=...&public_key=...
    // We detect that here and post the full URL back to the opener (which still holds the in-memory
    // ECDH keypair needed to finish the token exchange), then close — WITHOUT booting the heavy
    // wasm bundle inside the popup. On a normal load we inject the app scripts in order:
    //   sql-wasm.js (sql.js) -> odin-sqljs.js (sync bridge) -> homebase-app bundle.
    // The ffmpeg scripts only DEFINE globals (FFmpegWASM, MP4Box, __odinFfmpeg) — they
    // download nothing until the first video compress/segment lazily loads the core.
    // The bundle filename is substituted at build time by HtmlWebpackPlugin (see
    // webApp/webpack.config.d/html-plugin.js) — in production it's content-hashed for cache busting.
    (function () {
        var params = new URLSearchParams(location.search);
        var isAuthCallback = window.opener
            && location.pathname.indexOf("/authorization-code-callback") !== -1
            && params.has("state");
        if (isAuthCallback) {
            try {
                window.opener.postMessage({ type: "youauth-callback", url: location.href }, location.origin);
            } catch (e) { /* opener gone — nothing we can do */ }
            window.close();
            return;
        }
        var scripts = ["sql-wasm.js", "odin-sqljs.js", "mp4box.all.min.js", "ffmpeg-wrapper.js", "odin-ffmpeg.js", "<%= htmlWebpackPlugin.files.js[0] %>"];
        var loaded = 0;
        scripts.forEach(function (src) {
            var s = document.createElement("script");
            s.src = src;
            s.async = false; // script-inserted scripts run in insertion order when async=false
            s.onload = function () {
                loaded++;
                var last = loaded === scripts.length;
                // The bundle's onload only means its JS arrived — the wasm still has to be
                // fetched and compiled before main() runs, so this tops out at 40%.
                window.__homebaseBoot(last ? "Loading app…" : "Loading…", Math.round((loaded / scripts.length) * 40));
            };
            s.onerror = function () {
                window.__homebaseBootError("Couldn't load " + src + ". Check your connection and reload.");
            };
            document.body.appendChild(s);
        });
    })();
</script>

</body>
</html>
